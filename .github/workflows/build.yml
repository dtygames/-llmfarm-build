name: Build LLMFarm IPA
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          repository: guinmoon/LLMFarm
          ref: main
          submodules: recursive
      # 主仓库自带完整预编译库 llama_cpu.xcframework；llmfarm_core 的
      # Package.swift 却指向空的 llama.cpp/build-apple/llama.xcframework，
      # 这里把预编译库放到它期望的位置，避免昂贵的 C++ 源码编译。
      - name: Prepare llama.xcframework
        run: |
          set -euo pipefail
          SRC="llama_cpu.xcframework"
          DST="llmfarm_core.swift/llama.cpp/build-apple/llama.xcframework"
          echo "检查源框架: $SRC"
          test -d "$SRC/ios-arm64/llama.framework" || { echo "::error::源框架缺失"; exit 1; }
          mkdir -p "$(dirname "$DST")"
          rm -rf "$DST"
          cp -R "$SRC" "$DST"
          echo "已准备 $DST"

      # Xcode 16 要求每个 App Shortcut 短语必须包含 \(.applicationName)，
      # 老版本源码的 "Ask Local LLM" 缺少该占位符会导致元数据提取失败。
      - name: Fix App Shortcut utterance
        run: |
          set -euo pipefail
          python3 - <<'PY'
          p = "LLMFarm/Intents/LLMFarmShortcuts.swift"
          s = open(p, encoding="utf-8").read()
          old = '"Ask Local LLM"'
          new = '"Ask Local LLM in \\(.applicationName)"'
          if old in s:
              open(p, "w", encoding="utf-8").write(s.replace(old, new))
              print("patched App Shortcuts phrase")
          elif new in s:
              print("already patched")
          else:
              raise SystemExit("App Shortcut phrase not found")
          PY

      # 作者把 FineTune / Merge Lora 的界面入口注释掉了，但视图代码仍在工程里。
      # 这里把入口重新接回设置页，让编译出的 App 能直接在手机上微调。
      - name: Enable FineTune UI
        run: |
          set -euo pipefail
          cat > /tmp/patch_ui.py <<'PYEOF'
          import sys

          def patch(path, old, new, label):
              with open(path, encoding="utf-8") as f:
                  s = f.read()
              if old in s:
                  s = s.replace(old, new, 1)
                  print("OK:", label)
              elif new in s:
                  print("SKIP(already):", label)
              else:
                  print("FAIL:", label, "anchor not found", file=sys.stderr)
                  sys.exit(1)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(s)

          patch(
              "LLMFarm/Settings/AppSettingsTabs.swift",
              '            Spacer(minLength: 0)\n\n            TabButton(index: $index, targetIndex: 2, image: Image(systemName: "info.circle.fill"), text: "Info")',
              '            TabButton(index: $index, targetIndex: 2, image: Image(systemName: "slider.horizontal.3"), text: "FineTune")\n            .padding(.top,15)\n\n            TabButton(index: $index, targetIndex: 3, image: Image(systemName: "arrow.triangle.merge"), text: "Merge Lora")\n            .padding(.top,15)\n\n            Spacer(minLength: 0)\n\n            TabButton(index: $index, targetIndex: 4, image: Image(systemName: "info.circle.fill"), text: "Info")',
              "add FineTune + Merge Lora tabs",
          )

          patch(
              "LLMFarm/Settings/AppSettingsView.swift",
              '                    case 2:\n                        About()\n                        \n                    default:',
              '                    case 2:\n                        FineTuneView().environmentObject(fineTuneModel)\n                    case 3:\n                        ExportLoraView().environmentObject(fineTuneModel)\n                    case 4:\n                        About()\n                        \n                    default:',
              "wire FineTuneView + ExportLoraView",
          )
          PYEOF
          python3 /tmp/patch_ui.py

      - run: |
          xcodebuild archive \
            -project LLMFarm.xcodeproj \
            -scheme LLMFarm_Release \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/LLMFarm.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/LLMFarm.xcarchive/Products/Applications/LLMFarm.app" "$RUNNER_TEMP/Payload/"
          (cd "$RUNNER_TEMP" && zip -qry LLMFarm-unsigned.ipa Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: LLMFarm-unsigned-ipa
          path: ${{ runner.temp }}/LLMFarm-unsigned.ipa
